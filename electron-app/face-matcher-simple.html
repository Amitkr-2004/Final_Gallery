<!DOCTYPE html>
<html>
<head>
    <title>Face Matcher - Orchids Gallery</title>
    <style>
        :root {
            --color-primary: #800020;
            --color-primary-dark: #5C0015;
            --color-primary-light: #A64D5B;
            --color-gold: #DAA520;
            --color-success: #228B22;
            --color-error: #DC3545;
            --color-bg: #FFF8F5;
            --color-card: #FFFFFF;
            --color-border: #E8C4C4;
            --color-text: #333333;
            --color-text-light: #666666;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            padding: 20px;
            background: var(--color-bg);
            color: var(--color-text);
            margin: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--color-card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(128, 0, 32, 0.1);
            border: 1px solid var(--color-border);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--color-border);
        }

        .header-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-icon svg {
            width: 28px;
            height: 28px;
            stroke: white;
            fill: none;
            stroke-width: 2;
        }

        h1 {
            margin: 0;
            color: var(--color-primary);
            font-size: 24px;
            font-weight: 600;
        }

        .subtitle {
            color: var(--color-text-light);
            font-size: 14px;
            margin-top: 4px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(128, 0, 32, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        button svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--color-gold), #C9941A);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--color-success), #1B7A1B);
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 13px;
        }

        .result {
            margin-top: 24px;
            padding: 20px;
            background: var(--color-bg);
            border-radius: 10px;
            border: 1px solid var(--color-border);
        }

        .result h3 {
            margin: 0 0 16px 0;
            color: var(--color-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--color-card);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--color-border);
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--color-primary);
        }

        .stat-label {
            font-size: 12px;
            color: var(--color-text-light);
            margin-top: 4px;
        }

        .match {
            padding: 16px;
            margin: 12px 0;
            background: var(--color-card);
            border-left: 4px solid var(--color-primary);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .match-info {
            flex: 1;
            min-width: 200px;
        }

        .match-rank {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: var(--color-primary);
            color: white;
            border-radius: 50%;
            font-size: 14px;
            font-weight: 600;
            margin-right: 12px;
        }

        .match-name {
            font-weight: 600;
            color: var(--color-primary);
            font-size: 16px;
        }

        .match-details {
            color: var(--color-text-light);
            font-size: 13px;
            margin-top: 4px;
        }

        .match-similarity {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .similarity-bar {
            width: 100px;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
        }

        .similarity-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--color-primary), var(--color-gold));
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .similarity-text {
            font-weight: 600;
            color: var(--color-primary);
            min-width: 50px;
        }

        .match-actions {
            display: flex;
            gap: 8px;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .image-thumb {
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .image-thumb:hover {
            border-color: var(--color-primary);
            transform: scale(1.05);
        }

        .image-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-thumb .overlay {
            position: absolute;
            inset: 0;
            background: rgba(128, 0, 32, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .image-thumb:hover .overlay {
            opacity: 1;
        }

        .overlay svg {
            width: 24px;
            height: 24px;
            stroke: white;
            fill: none;
            stroke-width: 2;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px;
            color: var(--color-text-light);
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid var(--color-border);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            color: var(--color-error);
            padding: 16px;
            background: #FFF5F5;
            border-radius: 8px;
            border: 1px solid #FFCCCC;
        }

        .no-matches {
            text-align: center;
            padding: 40px;
            color: var(--color-text-light);
        }

        .download-all-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: var(--color-card);
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid var(--color-border);
        }

        .progress-indicator {
            display: none;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
            padding: 12px 16px;
            background: var(--color-bg);
            border-radius: 8px;
        }

        .progress-indicator.active {
            display: flex;
        }

        .progress-bar {
            flex: 1;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--color-primary);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 13px;
            color: var(--color-text-light);
            min-width: 100px;
            text-align: right;
        }

        /* Collection images section */
        .collection-images {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--color-border);
        }

        .collection-images h4 {
            margin: 0 0 12px 0;
            font-size: 14px;
            color: var(--color-text-light);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"></path>
                </svg>
            </div>
            <div>
                <h1>Face Collection Matcher</h1>
                <div class="subtitle">Orchids International School Gallery</div>
            </div>
        </div>

        <div class="button-group">
            <button onclick="selectAndMatch()" id="btnSelect">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                Select Image & Find Matches
            </button>
            <button onclick="testWithSample()" class="btn-secondary">
                <svg viewBox="0 0 24 24">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                Test with Sample
            </button>
        </div>

        <div id="progressIndicator" class="progress-indicator">
            <div class="spinner"></div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Processing...</div>
        </div>

        <div id="result"></div>
    </div>

    <script>
        // Store current matches for download functionality
        let currentMatches = [];
        let currentScannedFace = null;

        async function selectAndMatch() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                showLoading('Scanning face...');

                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const save = await window.electronAPI.scanner.saveTempImage(ev.target.result);
                        const result = await window.electronAPI.scanner.scanAndMatch(save.path, {
                            threshold: 0.6,
                            limit: 10,
                            searchMode: 'local'
                        });
                        await window.electronAPI.scanner.cleanupTemp();
                        displayResults(result);
                    } catch (error) {
                        showError(error.message);
                    }
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        async function testWithSample() {
            showLoading('Scanning sample image...');

            try {
                // Try to get first image from gallery
                const files = await window.electronAPI.gallery.getAllFiles({ limit: 1 });
                if (!files.success || !files.files || files.files.length === 0) {
                    showError('No images in gallery. Please upload some images first.');
                    return;
                }

                const samplePath = files.files[0].filepath;
                const result = await window.electronAPI.scanner.scanAndMatch(samplePath, {
                    threshold: 0.6,
                    limit: 10,
                    searchMode: 'local'
                });
                displayResults(result);
            } catch (error) {
                showError(error.message);
            }
        }

        function showLoading(message) {
            document.getElementById('result').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <span>${message}</span>
                </div>
            `;
        }

        function showError(message) {
            document.getElementById('result').innerHTML = `
                <div class="error">
                    <strong>Error:</strong> ${message}
                </div>
            `;
        }

        function displayResults(result) {
            const div = document.getElementById('result');

            if (!result.success) {
                showError(result.error || 'Scan failed');
                return;
            }

            // Store for download functionality
            currentMatches = result.matches || [];
            currentScannedFace = result.scanned_face;

            let html = '<div class="result">';
            html += '<h3><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> Scan Results</h3>';

            // Stats grid
            html += '<div class="stats-grid">';
            html += `<div class="stat-card">
                <div class="stat-value">${(result.scanned_face.confidence * 100).toFixed(0)}%</div>
                <div class="stat-label">Face Confidence</div>
            </div>`;
            html += `<div class="stat-card">
                <div class="stat-value">${result.stats.total_collections_scanned}</div>
                <div class="stat-label">Collections Scanned</div>
            </div>`;
            html += `<div class="stat-card">
                <div class="stat-value">${result.matches.length}</div>
                <div class="stat-label">Matches Found</div>
            </div>`;
            html += '</div>';

            if (result.matches.length > 0) {
                html += '<h4 style="margin: 20px 0 12px; color: var(--color-text-light);">Top Matches</h4>';

                result.matches.forEach((m, i) => {
                    const similarity = (m.match.similarity * 100).toFixed(1);
                    html += `<div class="match">
                        <div class="match-info">
                            <span class="match-rank">${i + 1}</span>
                            <span class="match-name">${escapeHtml(m.collection_name)}</span>
                            <div class="match-details">
                                ${m.total_faces} faces in collection | Distance: ${m.match.distance.toFixed(4)}
                            </div>
                        </div>
                        <div class="match-similarity">
                            <div class="similarity-bar">
                                <div class="similarity-fill" style="width: ${similarity}%"></div>
                            </div>
                            <span class="similarity-text">${similarity}%</span>
                        </div>
                        <div class="match-actions">
                            <button class="btn-small btn-success" onclick="downloadCollection('${m.collection_id}', '${escapeHtml(m.collection_name)}')">
                                <svg viewBox="0 0 24 24" width="16" height="16">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                                Download
                            </button>
                        </div>
                    </div>`;
                });

                // Download all button
                html += `<div class="download-all-bar">
                    <span style="color: var(--color-text-light);">
                        ${result.matches.length} collection(s) found
                    </span>
                    <button class="btn-success" onclick="downloadAllMatches()">
                        <svg viewBox="0 0 24 24" width="18" height="18">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Download All Collections
                    </button>
                </div>`;
            } else {
                html += `<div class="no-matches">
                    <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" fill="none" stroke-width="1.5" style="margin-bottom: 12px;">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <p>No matching faces found.</p>
                    <p style="font-size: 13px;">Try uploading more images or adjusting the similarity threshold.</p>
                </div>`;
            }

            html += '</div>';
            div.innerHTML = html;
        }

        async function downloadCollection(collectionId, collectionName) {
            showProgress(true, 'Preparing download...');

            try {
                // Setup progress listener
                const removeListener = window.electronAPI.download.onProgress((progress) => {
                    const percent = Math.round((progress.current / progress.total) * 100);
                    updateProgress(percent, `Downloading ${progress.current}/${progress.total}...`);
                });

                const result = await window.electronAPI.download.downloadCollection(collectionId);
                removeListener();
                showProgress(false);

                if (result.canceled) {
                    return;
                }

                if (!result.success) {
                    showError(result.error);
                    return;
                }

                // Show success message
                alert(`Downloaded ${result.results.success} image(s) to:\n${result.folder}`);

            } catch (error) {
                showProgress(false);
                showError(error.message);
            }
        }

        async function downloadAllMatches() {
            if (currentMatches.length === 0) {
                alert('No matches to download');
                return;
            }

            // First, let user select a folder
            const folderResult = await window.electronAPI.download.selectFolder();
            if (!folderResult.success || folderResult.canceled) {
                return;
            }

            const saveFolder = folderResult.folder;
            showProgress(true, 'Starting download...');

            let totalSuccess = 0;
            let totalFailed = 0;

            try {
                for (let i = 0; i < currentMatches.length; i++) {
                    const match = currentMatches[i];
                    updateProgress(
                        Math.round(((i + 1) / currentMatches.length) * 100),
                        `Downloading collection ${i + 1}/${currentMatches.length}: ${match.collection_name}`
                    );

                    const result = await window.electronAPI.download.downloadCollection(match.collection_id, saveFolder);

                    if (result.success) {
                        totalSuccess += result.results.success;
                        totalFailed += result.results.failed;
                    }
                }

                showProgress(false);
                alert(`Download complete!\n\nTotal images downloaded: ${totalSuccess}\nFailed: ${totalFailed}\n\nSaved to: ${saveFolder}`);

            } catch (error) {
                showProgress(false);
                showError(error.message);
            }
        }

        function showProgress(show, text = '') {
            const indicator = document.getElementById('progressIndicator');
            if (show) {
                indicator.classList.add('active');
                document.getElementById('progressText').textContent = text;
                document.getElementById('progressFill').style.width = '0%';
            } else {
                indicator.classList.remove('active');
            }
        }

        function updateProgress(percent, text) {
            document.getElementById('progressFill').style.width = `${percent}%`;
            if (text) {
                document.getElementById('progressText').textContent = text;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
